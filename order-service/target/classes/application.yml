server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    change-log: classpath:db/order-changelog/db.changelog-master.xml

inventory:
  service:
    base-url: http://localhost:8081

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    liquibase: INFO